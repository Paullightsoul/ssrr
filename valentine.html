<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>снинолуга</title>
    <style>
        body {
            background-color: #ffc8fd;
            font-family: 'Comic Sans MS', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .buttons {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
            position: relative;
        }

        #yesBtn {
            background-color: #97cdff;
            color: white;
            z-index: 2;
        }

        #noBtn {
            background-color: #ff6b6b;
            color: white;
            z-index: 1;
        }

        .gif {
            margin: 20px 0;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            color: #ff6b6b;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">снинолуга</h1>
        <div class="gif">
            <img src="media/VM1fcpu2bKs1e2Kdbj/200w.gif" alt="Cute gif">
        </div>
        <div class="buttons" id="buttons">
            <button id="yesBtn">Да</button>
            <button id="noBtn">Нет</button>
        </div>
    </div>
    <div class="footer">From <span id="from">Bae</span> to <span id="to">Bae</span> 💕</div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from');
        const toParam = urlParams.get('to');

        // Update the text if parameters exist
        if (fromParam) document.getElementById('from').textContent = fromParam;
        if (toParam) document.getElementById('to').textContent = toParam;

        const steps = ['снинолуга', 'ты попа?', 'ты казявка'];
        let step = 0;
        let yesBtnSize = 1;
        let noBtnSize = 1;

        const title = document.getElementById('title');
        const buttons = document.getElementById('buttons');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        function showStep() {
            title.textContent = steps[step];
            const isFinal = step === steps.length - 1;
            buttons.hidden = isFinal;
            if (!isFinal) {
                yesBtnSize = 1;
                noBtnSize = 1;
                yesBtn.style.transform = '';
                noBtn.style.transform = '';
            }
        }

        noBtn.addEventListener('click', () => {
            yesBtnSize *= 1.25;
            yesBtn.style.transform = `scale(${yesBtnSize})`;
            noBtnSize -= 0.1;
            noBtn.style.transform = `scale(${Math.max(noBtnSize, 0)})`;
        });

        yesBtn.addEventListener('click', () => {
            if (step < steps.length - 1) {
                step += 1;
                showStep();
            }
        });
    </script>
</body>
</html>
